<!DOCTYPE html>
<html>
<head>
  <title>Interactive AR Model</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://cdn.rawgit.com/jeromeetienne/AR.js/2.2.2/aframe/build/aframe-ar.js"></script>

  <!-- Animation Mixer -->
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>

  <!-- SCALE ON CLICK -->
  <script>
    AFRAME.registerComponent('scale-on-click', {
      init: function () {
        let enlarged = false;
        this.el.addEventListener('click', () => {
          enlarged = !enlarged;
          this.el.setAttribute('scale', enlarged ? '0.2 0.2 0.2' : '0.1 0.1 0.1');
        });
      }
    });
  </script>

  <!-- DRAG ROTATE -->
  <script>
    AFRAME.registerComponent('drag-rotate', {
      init: function () {
        let isDragging = false;
        let previousX;

        this.el.sceneEl.addEventListener('mousedown', (e) => {
          isDragging = true;
          previousX = e.screenX;
        });

        this.el.sceneEl.addEventListener('mouseup', () => {
          isDragging = false;
        });

        this.el.sceneEl.addEventListener('mousemove', (e) => {
          if (!isDragging) return;

          const delta = e.screenX - previousX;
          previousX = e.screenX;

          const rotation = this.el.getAttribute('rotation');
          this.el.setAttribute('rotation', {
            x: rotation.x,
            y: rotation.y + delta * 0.5,
            z: rotation.z
          });
        });
      }
    });
  </script>

  <!-- PINCH SCALE (MOBILE) -->
  <script>
    AFRAME.registerComponent('pinch-scale', {
      init: function () {
        let initialDistance = null;
        let currentScale = this.el.getAttribute('scale');

        const scene = this.el.sceneEl;

        scene.addEventListener('touchstart', (e) => {
          if (e.touches.length === 2) {
            initialDistance = this.getDistance(e.touches[0], e.touches[1]);
          }
        });

        scene.addEventListener('touchmove', (e) => {
          if (e.touches.length === 2 && initialDistance) {
            const newDistance = this.getDistance(e.touches[0], e.touches[1]);

            let scaleFactor = newDistance / initialDistance;

            let newScale = {
              x: currentScale.x * scaleFactor,
              y: currentScale.y * scaleFactor,
              z: currentScale.z * scaleFactor
            };

            // Limit scale
            newScale.x = Math.min(Math.max(newScale.x, 0.05), 3);
            newScale.y = Math.min(Math.max(newScale.y, 0.05), 3);
            newScale.z = Math.min(Math.max(newScale.z, 0.05), 3);

            this.el.setAttribute('scale', newScale);
          }
        });

        scene.addEventListener('touchend', () => {
          initialDistance = null;
          currentScale = this.el.getAttribute('scale');
        });
      },

      getDistance: function (t1, t2) {
        const dx = t1.pageX - t2.pageX;
        const dy = t1.pageY - t2.pageY;
        return Math.sqrt(dx * dx + dy * dy);
      }
    });
  </script>

</head>

<body style="margin:0; overflow:hidden;">

<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" cursor="rayOrigin: mouse">

  <!-- YOUR MARKER -->
  <a-marker type="pattern" url="pattern-b.patt">

    <!-- INTERACTIVE MODEL -->
    <a-entity
      gltf-model="url(house.glb)"
      animation-mixer
      position="0 0.5 0"
      scale="0.1 0.1 0.1"
      rotation="0 0 0"

      pinch-scale
      scale-on-click
      drag-rotate

      animation__click="property: rotation; to: 0 360 0; dur: 2000; startEvents: click">
    </a-entity>

  </a-marker>

  <!-- CAMERA -->
  <a-entity camera>
    <a-cursor></a-cursor>
  </a-entity>

</a-scene>

</body>
</html>
